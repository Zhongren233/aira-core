<html>
<div id="content"></div>
</html>
<script>
    async function fetchData() {
        showLoading();
        try {
            const response = await fetch('https://api.aira.love/ansan/story/campaignChapters');
            const jsonData = await response.json();

            if (jsonData.code !== 0) {
                throw new Error('Failed to fetch data');
            }

            displayData(jsonData.data);
        } catch (error) {
            console.error('Error fetching data:', error);
        } finally {
            hideLoading();
        }
    }

    function displayData(chapters) {
        const container = document.getElementById('content');
        container.innerHTML = '';

        const table = document.createElement('table');
        table.classList.add('styled-table');

        const thead = document.createElement('thead');
        thead.innerHTML = `
        <tr>
            <th>章节 ID</th>
            <th>名称</th>
            <th>故事数量</th>
            <th>发布时间</th>
            <th>限时公开至</th>
            <th>下载</th>
        </tr>
    `;
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        chapters.forEach(chapter => {
            const row = document.createElement('tr');
            row.innerHTML = `
            <td>${chapter.id}</td>
            <td>${chapter.name}</td>
            <td>${chapter.storiesCount}</td>
            <td>${new Date(chapter.releasableBeganAt).toLocaleString()}</td>
            <td>${chapter.storyLimitedRelease ? `${new Date(chapter.storyLimitedRelease.endedAt).toLocaleString()}` : '无'}</td>
            <td><button class="download-btn" data-name="${chapter.name}" data-url="https://api.aira.love/ansan/story/readStories?chapterId=${chapter.id}">下载</button></td>
        `;
            tbody.appendChild(row);
        });

        table.appendChild(tbody);
        container.appendChild(table);

        // 添加下载按钮的点击事件监听器
        document.querySelectorAll('.download-btn').forEach(button => {
            button.addEventListener('click', () => {
                const url = button.getAttribute('data-url');
                const name = button.getAttribute('data-name');
                downloadFile(url, name);
            });
        });
    }

    async function downloadFile(url, name) {
        showLoading();
        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error('Failed to download file');
            }
            const blob = await response.blob();
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = name + ".txt";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        } catch (error) {
            console.error('Error downloading file:', error);
        } finally {
            hideLoading();
        }
    }

    function showLoading() {
        document.getElementById('loading').style.display = 'block';
    }

    function hideLoading() {
        document.getElementById('loading').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', fetchData);

    // 添加 CSS 样式
    const style = document.createElement('style');
    style.innerHTML = `
    .styled-table {
        width: 100%;
        border-collapse: collapse;
        margin: 25px 0;
        font-size: 18px;
        text-align: left;
    }
    .styled-table th, .styled-table td {
        padding: 12px;
        border: 1px solid #ddd;
    }
    .styled-table th {
        background-color: #4CAF50;
        color: white;
    }
    .styled-table tr:nth-child(even) {
        background-color: #f2f2f2;
    }
    .download-btn {
        display: inline-block;
        padding: 8px 12px;
        color: white;
        background-color: #007BFF;
        text-decoration: none;
        border-radius: 5px;
        transition: background 0.3s;
        border: none;
        cursor: pointer;
    }
    .download-btn:hover {
        background-color: #0056b3;
    }
    #loading {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(255, 255, 255, 0.8);
        z-index: 1000;
        width: 100px;
        height: 100px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 10px;
    }
    .spinner {
        border: 4px solid rgba(0, 0, 0, 0.1);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border-left-color: #09f;
        animation: spin 1s ease infinite;
    }
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
`;
    document.head.appendChild(style);

    // 添加加载动画元素
    document.body.innerHTML += '<div id="loading"><div class="spinner"></div></div>';

</script>
